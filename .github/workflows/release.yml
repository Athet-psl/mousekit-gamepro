name: Release

# Every push to main: run the tests, build the .deb (on Ubuntu) and the .rpm (on Fedora) and publish them as
# release v0.2.<commit count>, with the messages of the commits since the previous release as its notes (the
# app shows them as the changelog). Then the Windows job tests on Windows and adds the installer,
# mousekit-setup-<version>.exe, to the release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  deb:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-evdev
          python3 -m unittest discover tests

      - name: Version
        id: version
        run: echo "version=$(packaging/version.sh)" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: packaging/build-deb.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install the build tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build python3 python3-evdev

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test
        run: python3 -m unittest discover tests

      - name: Build the .rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/build-rpm.sh "$(packaging/version.sh)"

      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/*.rpm

  release:
    needs: [deb, rpm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deb.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git log --reverse --format='**%s**%n%n%b' ${previous:+"$previous..HEAD"} > notes.md
          gh release create "v$VERSION" "dist/mousekit_${VERSION}_all.deb" "dist/mousekit-${VERSION}-1.noarch.rpm" \
            --title "Mousekit for GamePro $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  windows:
    needs: [deb, release]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyinstaller
          python -m unittest discover tests

      - name: Build the installer
        env:
          VERSION: ${{ needs.deb.outputs.version }}
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./packaging/windows/build.ps1 -Version $env:VERSION
          if (-not (Test-Path "dist/mousekit-setup-$env:VERSION.exe")) { throw "no installer was built" }

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deb.outputs.version }}
        run: gh release upload "v$env:VERSION" "dist/mousekit-setup-$env:VERSION.exe"

name: Release

# Every push to main: run the tests, build the .deb and publish it as release v0.2.<commit count>,
# with the messages of the commits since the previous release as its notes (the app shows them as the changelog).
# Then the Windows job tests on Windows and adds the installer, mousekit-setup-<version>.exe, to the release.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-evdev
          python3 -m unittest discover tests

      - name: Build the .deb
        id: build
        run: |
          base=$(sed -n 's/^__version__ = "\([0-9]*\.[0-9]*\)\..*/\1/p' mousekit/__init__.py)
          version="$base.$(git rev-list --count HEAD)"
          packaging/build-deb.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git log --reverse --format='**%s**%n%n%b' ${previous:+"$previous..HEAD"} > notes.md
          gh release create "v$VERSION" "dist/mousekit_${VERSION}_all.deb" \
            --title "Mousekit for GamePro $VERSION" --notes-file notes.md --target "$GITHUB_SHA"

  windows:
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 pyinstaller
          python -m unittest discover tests

      - name: Build the installer
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./packaging/windows/build.ps1 -Version $env:VERSION
          if (-not (Test-Path "dist/mousekit-setup-$env:VERSION.exe")) { throw "no installer was built" }

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$env:VERSION" "dist/mousekit-setup-$env:VERSION.exe"
